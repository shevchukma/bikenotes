# Конфигурация nginx для bikenotes.ru
# Расположение файла: /etc/nginx/sites-available/bikenotes.ru
# Активировать: ln -s /etc/nginx/sites-available/bikenotes.ru /etc/nginx/sites-enabled/

server {
    listen 80;
    listen [::]:80;
    server_name bikenotes.ru www.bikenotes.ru;

    # Редирект с HTTP на HTTPS (раскомментировать после получения SSL)
    # return 301 https://$host$request_uri;

    root /var/www/bikenotes.ru;
    index index.html;

    # Логи
    access_log /var/log/nginx/bikenotes.ru.access.log;
    error_log  /var/log/nginx/bikenotes.ru.error.log;

    # Кодировка
    charset utf-8;

    # Основная обработка запросов
    location / {
        try_files $uri $uri/ $uri.html =404;
    }

    # Кэширование статики
    location ~* \.(css|js|svg|ico|woff|woff2|ttf)$ {
        expires 30d;
        add_header Cache-Control "public, immutable";
        access_log off;
    }

    location ~* \.(html)$ {
        expires 1h;
        add_header Cache-Control "public, must-revalidate";
    }

    # Безопасность — скрыть системные файлы
    location ~ /\. {
        deny all;
        access_log off;
        log_not_found off;
    }

    # Gzip сжатие
    gzip on;
    gzip_vary on;
    gzip_types text/plain text/css text/javascript application/javascript image/svg+xml;
    gzip_min_length 1024;

    # Заголовки безопасности
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "no-referrer-when-downgrade";
}


